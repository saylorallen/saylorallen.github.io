<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="styles.css">

</head>
    <section class="header-top" aria-label="site header" style="font-family: 'Plus Jakarta Sans', sans-serif;">
      <h1 style="font-size: max(36px, 3vw); margin:1vw;">
        <span class="" style="font-weight:700; color: var(--b4);">saylor</span>
        <span class="" style="font-weight:300; color: var(--g4);">allen</span>
      </h1>
    </section>

<body class="info-page">

        <section class="two-columns" aria-label="curriculum details">
      <style>
      /* layout: left-year column 25%, right-description column 25%, spacer 50% */
      .two-columns { display: grid !important; grid-template-columns: 15% 35% 50%; gap: 2rem; align-items: start; margin: 2rem 0; font-family: inherit; }
      /* the .left container should occupy the first two grid columns (50% total)
         the internal .cv-table will split that 50% into two equal columns (25% each) */
      .two-columns .left { grid-column: 1 / 3; }
      @media (max-width:1200px) { .two-columns { grid-template-columns: 1fr; } .two-columns .left { grid-column: auto; } }
      .two-columns .section-title{ font-size:1.1rem; margin:0 0 .5rem; font-weight:600; }
      .two-columns .muted{ color:var(--g4,#666); font-size:.95rem; }
      </style>

      <div class="left">
        <style>
          .cv-table {
            display: grid;
            /* split the left area into two equal columns so combined they equal 50% of page */
            grid-template-columns: 1fr 3fr;
            gap: .5rem 1rem;
            max-height: calc(100vh - 240px);
            overflow: auto;
            padding-right: .5rem;
          }
          /* add 20px spacing from the left page border for the left column */
          .two-columns .left { padding-left: 60px; box-sizing: border-box; }

          .cv-table .cell { padding: .25rem 0; }
          .cv-table .left-cell { font-weight:700; min-width:0; display:flex; align-items:top; justify-content:left; }
          .cv-table .right-cell { min-width:0; color:var(--g4,#666); }
          @media (max-width:700px) {
            .cv-table { grid-template-columns: 1fr; }
          }
        </style>

        <div class="cv-table" role="table" aria-label="experience table">
          <div class="left-cell cell" role="rowheader"><p class="contact-title">CONTACT</p></div>
          <div class="right-cell cell" role="cell"><p class="contact-title"></p></div>
          
          <div class="left-cell cell">
            <p class="contact-body"></p></div>
          <div class="right-cell cell">
            <p class="contact-body">
          </p></div>

          <div class="left-cell cell">
            <p class="contact-body">email</p></div>
          <div class="right-cell cell">
            <p class="contact-body">sayall@umich.edu
          </p></div>

          <div class="left-cell cell">
            <p class="contact-body">phone</p></div>
          <div class="right-cell cell">
            <p class="contact-body">+1 (608) 698 5547
          </p></div>

          <div class="left-cell cell">
            <p class="contact-body">address</p></div>
          <div class="right-cell cell">
            <p class="contact-body">contact for details
          </p></div>
    
</body>

    <footer class="site-footer">
    <a href="index.html" class="margin-name">_ saylor allen</a>

    <nav class="margin-navigation">
      <a href="index.html">HOME</a>

</html>
