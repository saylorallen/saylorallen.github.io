<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>projects</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="project-page">
    
<main class="projects-main">
    <style>
        /* images locked to the top of the projects area */
        .projects-main{min-height:calc(100vh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1rem 0;padding-top:24rem;}
        .projects-row{display:flex;justify-content:center;gap:0.5rem;width:100%;max-width:1400px;flex-wrap:nowrap;align-items:center}
        /* allow items to shrink so all 13 fit on one line without scrolling */
        .project-link{flex:1 1 0;min-width:40px;text-align:center;line-height:0;font-weight:300;display:flex;align-items:center;justify-content:center}
        .project-link img{width:100%;height:auto;max-height:200px;object-fit:cover;display:block;border-radius:0px;vertical-align:middle}

        /* prevent global link hover rules from shifting these tiles */
        .projects-row .project-link,
        .projects-row .project-link:link,
        .projects-row .project-link:visited { font-weight:300 !important; }
        .projects-row .project-link:hover,
        .projects-row .project-link:active,
        .projects-row .project-link:focus { font-weight:300 !important; transform: none !important; margin-top: 0 !important; }
        /* caption pinned to viewport bottom (above footer) */
        .project-hover-text{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--footer-height) + 12rem);width:90%;max-width:1400px;padding:.5rem 1rem;text-align:center;color:var(--g5);font-family:var(--font-regular);font-weight:700;font-size:128px;line-height:1.1;min-height:1.25rem;opacity:0;transition:opacity 1s ease;pointer-events:none;z-index:40}
        .project-hover-text.visible{opacity:1}
        @media (max-width:1200px){.projects-row{flex-wrap:wrap}.project-link{flex:0 1 calc(100%/6 - 0.9rem);}}
        @media (max-width:600px){.project-link{flex:0 1 calc(100%/3 - 0.6rem);} .project-link img{height:64px;}}
    </style>

    <div class="projects-row" aria-label="Projects row">
        <a class="project-link" href="logistique.html">
            <img src="images/logistique opener.jpg" alt="LOGISTIQUE" style="aspect-ratio:1/1;object-fit:cover;border-radius:0;display:block;width:100%;height:auto;"></a>
        <a class="project-link" href="healing.html">
            <img src="images/DSC09374_01.png" alt="HEALING" style="aspect-ratio:1/1;object-fit:cover;border-radius:0;display:block;width:100%;height:auto;"></a>
        <a class="project-link" href="project3.html"><img src="images/project3.jpg" alt="Project 3"></a>
        <a class="project-link" href="project4.html"><img src="images/project4.jpg" alt="Project 4"></a>
        <a class="project-link" href="project5.html"><img src="images/project5.jpg" alt="Project 5"></a>
        <a class="project-link" href="project6.html"><img src="images/project6.jpg" alt="Project 6"></a>
        <a class="project-link" href="project7.html"><img src="images/project7.jpg" alt="Project 7"></a>
        <a class="project-link" href="project8.html"><img src="images/project8.jpg" alt="Project 8"></a>
        <a class="project-link" href="project9.html"><img src="images/project9.jpg" alt="Project 9"></a>
        <a class="project-link" href="project10.html"><img src="images/project10.jpg" alt="Project 10"></a>
        <a class="project-link" href="project11.html"><img src="images/project11.jpg" alt="Project 11"></a>
        <a class="project-link" href="project12.html"><img src="images/project12.jpg" alt="Project 12"></a>
        <a class="project-link" href="project13.html"><img src="images/project13.jpg" alt="Project 13"></a>
        </div>

        <div class="project-hover-text" aria-live="polite" aria-atomic="true"></div>

        <script>
        (function(){
            const row = document.querySelector('.projects-row');
            const caption = document.querySelector('.project-hover-text');
            if (!row || !caption) return;

            function setCaption(text){
                caption.textContent = text || '';
                caption.classList.toggle('visible', !!text);
            }

            row.addEventListener('mouseover', (e)=>{
                const link = e.target.closest('.project-link');
                if (!link) return;
                const img = link.querySelector('img');
                setCaption(img?.alt || '');
            });

            row.addEventListener('mouseout', (e)=>{
                const related = e.relatedTarget;
                // if moving out of the row entirely, clear; if moving to another link, mouseover will update
                if (!related || !row.contains(related)) setCaption('');
            });

            // keyboard accessibility: show on focus, hide on blur
            row.querySelectorAll('.project-link').forEach(link=>{
                link.addEventListener('focus', ()=>{
                    const img = link.querySelector('img');
                    setCaption(img?.alt || '');
                });
                link.addEventListener('blur', ()=> setCaption(''));
            });
        })();
        </script>

        </main>
